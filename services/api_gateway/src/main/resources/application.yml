server:
  port: 8090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: master-data-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/master/**

        - id: payroll-engine
          uri: http://localhost:8083
          predicates:
            - Path=/api/payroll/**

        - id: historicos-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/historicos/**

